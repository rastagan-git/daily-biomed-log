name: Daily learning reminder

on:
  schedule:
    # 13:17 UTC = 21:17 in Asia/Shanghai.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check today's entry
        id: today
        shell: bash
        run: |
          day="$(TZ=Asia/Shanghai date +%F)"
          year="${day:0:4}"
          month="${day:5:2}"
          entry_path="entries/$year/$month/$day.md"

          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "entry_path=$entry_path" >> "$GITHUB_OUTPUT"

          if [ -f "$entry_path" ]; then
            echo "recorded=true" >> "$GITHUB_OUTPUT"
          else
            echo "recorded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or create the inbox Issue
        if: steps.today.outputs.recorded == 'false'
        id: inbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          gh label create daily-log-inbox \
            --color 2DA44E \
            --description "Inbox for daily learning log commands" \
            --force

          issue_number="$(gh issue list \
            --state open \
            --label daily-log-inbox \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$issue_number" ]; then
            issue_url="$(gh issue create \
              --title "Daily learning log inbox" \
              --body-file .github/daily-log-issue.md \
              --label daily-log-inbox \
              --assignee "$REPOSITORY_OWNER")"
            issue_number="${issue_url##*/}"
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Send one evening reminder
        if: steps.today.outputs.recorded == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ steps.inbox.outputs.issue_number }}
          DAY: ${{ steps.today.outputs.day }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "@$REPOSITORY_OWNER，$DAY 还没有学习记录。睡前回复一条 \`/log 今天学到了……\` 吧——别让草坪秃一块。🌱"
